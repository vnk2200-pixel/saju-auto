<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>나의 사주 풀이 결과 | 러브 오라클</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf7ef; --card:#fff; --line:#e5dbcf; --ink:#302925; --muted:#6d625b;
  --brown:#60463a; --seal:#a3402a; --soft:#f3ebe0;
  --wood:#3f8a5a; --fire:#c8452d; --earth:#b8892f; --metal:#7d828c; --water:#2f4f7a;
  --serif:"Noto Serif KR","Batang",serif; --sans:"Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.75;font-size:16px}
.w{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0}
a{color:var(--seal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
.top{text-align:center}
.top .brand{color:var(--seal);font-weight:700;letter-spacing:.04em}
.top h1{font-size:clamp(22px,5vw,30px);margin:8px 0 4px;color:#653d31}
.muted{color:var(--muted);font-size:14px}
.save{background:#fff4c2;border:1px solid #e8cf61;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.save .linkrow{display:flex;gap:8px}
.save input{flex:1;min-width:0;padding:9px;border:1px solid #d8cec2;border-radius:8px;font:inherit;font-size:13px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--brown);color:#fff;text-decoration:none;display:inline-block;text-align:center}
.person h2{font-size:20px}
.person .meta{color:var(--muted);font-size:14px;margin:2px 0 12px}
.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.col{border:1px solid var(--line);border-radius:12px;padding:8px 4px;background:#fffdf9}
.col.me{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal) inset}
.col small{display:block;color:var(--muted);font-size:12px}
.g{display:block;font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:700}
.gk{display:block;font-size:12px;color:var(--muted)}
.god{display:block;font-size:12px;margin-top:2px}
.e0{color:var(--wood)}.e1{color:var(--fire)}.e2{color:var(--earth)}.e3{color:var(--metal)}.e4{color:var(--water)}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.bar{display:grid;grid-template-columns:52px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.bar .track{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:5px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.score{display:flex;align-items:center;gap:14px}
.score .num{font-family:var(--serif);font-size:48px;color:var(--seal);line-height:1;white-space:nowrap}
section.s h3{font-size:19px;color:#653d31;margin-bottom:8px}
section.s p{margin:0 0 10px}
section.s ul{margin:6px 0 0;padding-left:20px}
.tbl{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700}
td:nth-child(3){white-space:nowrap;font-weight:700}
.disc{font-size:13px;color:var(--muted)}
.center{text-align:center;padding:40px 20px}
.spin{width:36px;height:36px;border:4px solid var(--soft);border-top-color:var(--seal);border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.preview{background:#e9f1ff;border:1px solid #9db6e6;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:10px}
@media(max-width:520px){.g{font-size:24px}.score .num{font-size:40px}}
</style>
</head>
<body>
<div class="w" id="app">
  <div class="card center" id="loading">
    <div class="spin" aria-hidden="true"></div>
    <b id="loadingText">결과를 불러오는 중입니다…</b>
    <p class="muted">창을 닫지 말고 잠시만 기다려 주세요.</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var app = document.getElementById("app");
  var EL = ["목(木)","화(火)","토(土)","금(金)","수(水)"];
  var ELC = ["var(--wood)","var(--fire)","var(--earth)","var(--metal)","var(--water)"];
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function q(name){ return new URLSearchParams(location.search).get(name) || ""; }

  function fail(title, msg){
    app.innerHTML = '<div class="card center"><h1 style="font-size:22px">'+esc(title)+'</h1>' +
      '<p>'+esc(msg)+'</p><p class="muted">문제가 계속되면 고객센터 010-5088-9989로 연락해 주세요.' +
      (q("orderId") ? '<br>주문번호: '+esc(q("orderId")) : '') + '</p>' +
      '<a class="btn" href="/">처음 화면으로</a></div>';
  }

  function post(url, body){
    return fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().then(function(d){ if (!r.ok || d.status !== "success"){ var e = new Error(d.message || "요청을 처리하지 못했습니다."); e.code = d.code; throw e; } return d; }); });
  }

  function chartHtml(p){
    var cols = p.chart.rows.map(function(r){
      if (r.unknown) return '<div class="col"><small>'+esc(r.label)+'</small><span class="g muted">?</span><span class="g muted">?</span><span class="god">시간 모름</span></div>';
      return '<div class="col'+(r.label==="일주"?" me":"")+'"><small>'+esc(r.label)+'</small>' +
        '<span class="god">'+esc(r.stem_god)+'</span>' +
        '<span class="g e'+r.stem_el+'">'+esc(r.stem)+'</span><span class="gk">'+esc(r.stem_k)+' · '+EL[r.stem_el].charAt(0)+'</span>' +
        '<span class="g e'+r.branch_el+'">'+esc(r.branch)+'</span><span class="gk">'+esc(r.branch_k)+' · '+EL[r.branch_el].charAt(0)+'</span>' +
        '<span class="god">'+esc(r.branch_god)+'</span></div>';
    }).join("");
    var max = Math.max.apply(null, p.chart.elements.concat([1]));
    var bars = p.chart.elements.map(function(v, i){
      return '<div class="bar"><span>'+EL[i]+'</span><span class="track"><span class="fill" style="width:'+(v/max*100)+'%;background:'+ELC[i]+'"></span></span><b>'+v+'</b></div>';
    }).join("");
    return '<div class="card person"><h2>'+esc(p.name)+'님의 사주 명식</h2>' +
      '<div class="meta">'+esc(p.gender)+' · '+esc(p.birth)+' · '+esc(p.animal)+'<br>일간: '+esc(p.day_master)+'</div>' +
      '<div class="chart">'+cols+'</div><div class="bars" aria-label="오행 분포">'+bars+'</div></div>';
  }

  function sectionHtml(s){
    var h = '<section class="card s"><h3>'+esc(s.title)+'</h3>';
    var m = /^궁합 점수 (\d+)점\. (.*)$/.exec(s.paras[0] || "");
    if (m){
      h += '<div class="score"><span class="num">'+m[1]+'<small style="font-size:18px">점</small></span><p style="margin:0">'+esc(m[2])+'</p></div>';
      s.paras.slice(1).forEach(function(p){ h += '<p style="margin-top:10px">'+esc(p)+'</p>'; });
    } else {
      s.paras.forEach(function(p){ h += '<p>'+esc(p)+'</p>'; });
    }
    if (s.items) h += '<ul>' + s.items.map(function(i){ return '<li>'+esc(i)+'</li>'; }).join("") + '</ul>';
    if (s.table){
      h += '<div class="tbl"><table><thead><tr>' + s.table.head.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join("") + '</tr></thead><tbody>' +
        s.table.rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join("") + '</tr>'; }).join("") +
        '</tbody></table></div>';
    }
    return h + '</section>';
  }

  function render(res, token, receipt){
    var link = location.origin + "/kr/r/" + token;
    var h = '<div class="card top"><div class="brand">🔮 러브 오라클 · 2027 신년 사주보감</div>' +
      '<h1>'+esc(res.product.name)+'</h1>' +
      '<div class="muted">'+(res.order_id && res.order_id !== "PREVIEW" ? '주문번호 '+esc(res.order_id) : '')+'</div>' +
      (res.preview ? '<div class="preview">사장님 미리보기 화면입니다. 결제 없이 생성된 풀이입니다.</div>' : '') +
      '<div class="save"><b>📌 이 화면의 주소를 꼭 저장해 두세요.</b>' +
      '<span>아래 링크로 언제든 이 풀이를 다시 볼 수 있습니다. 카카오톡 "나와의 채팅"에 붙여 넣어 두면 편리합니다.</span>' +
      '<div class="linkrow"><input id="link" readonly value="'+esc(link)+'" aria-label="결과 링크"><button type="button" id="copy">링크 복사</button></div>' +
      (receipt ? '<a href="'+esc(receipt)+'" target="_blank" rel="noopener">결제 영수증 보기</a>' : '') +
      '</div></div>';
    res.people.forEach(function(p){ h += chartHtml(p); });
    res.sections.forEach(function(s){ h += sectionHtml(s); });
    h += '<div class="card disc">'+esc(res.disclaimer)+'<br><br>러브 오라클 · 고객센터 010-5088-9989 (평일 09:00~18:00)</div>' +
      '<p style="text-align:center;margin-top:18px"><a class="btn" href="/">다른 풀이 보러 가기</a></p>';
    app.innerHTML = h;
    document.getElementById("copy").addEventListener("click", function(){
      var input = document.getElementById("link"), btn = this;
      function done(){ btn.textContent = "복사됨"; setTimeout(function(){ btn.textContent = "링크 복사"; }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(input.value).then(done, function(){ input.select(); });
      } else { input.select(); try { document.execCommand("copy"); done(); } catch(e){} }
    });
  }

  var parts = location.pathname.split("/");  // ["", "kr", "success"|"r"|"fail", token]
  var kind = parts[2], token = parts[3] || "";

  if (kind === "fail"){
    var code = q("code");
    var canceled = code === "PAY_PROCESS_CANCELED" || code === "USER_CANCEL";
    fail(canceled ? "결제를 취소하셨습니다" : "결제가 완료되지 않았습니다",
         q("message") || (canceled ? "결제가 취소되어 요금이 청구되지 않았습니다. 다시 결제하시려면 처음 화면으로 돌아가 주세요." : "결제 과정에서 문제가 생겼습니다. 다시 시도해 주세요."));
    return;
  }

  if (kind === "success"){
    document.getElementById("loadingText").textContent = "결제를 확인하고 풀이를 만들고 있습니다…";
    var key = "lo_done_" + q("orderId");
    var saved = null;
    try { saved = sessionStorage.getItem(key); } catch(e){}
    if (saved){ location.replace("/kr/r/" + saved); return; }
    post("/api/kr/confirm", {token: token, paymentKey: q("paymentKey"), orderId: q("orderId"), amount: q("amount")})
      .then(function(d){
        try { sessionStorage.setItem(key, d.token); } catch(e){}
        history.replaceState(null, "", "/kr/r/" + d.token);
        render(d.result, d.token, d.receipt_url);
      })
      .catch(function(e){ fail("결제를 확인하지 못했습니다", e.message); });
    return;
  }

  if (kind === "kakao" && parts[3] === "ok"){
    var kToken = parts[4] || "";
    document.getElementById("loadingText").textContent = "카카오페이 결제를 확인하고 풀이를 만들고 있습니다…";
    var kKey = "lo_done_" + kToken.slice(0, 40), kSaved = null, tid = "";
    try { kSaved = sessionStorage.getItem(kKey); } catch(e){}
    if (kSaved){ location.replace("/kr/r/" + kSaved); return; }
    try { tid = sessionStorage.getItem("lo_tid") || ""; } catch(e){}
    post("/api/kr/kakao-approve", {token: kToken, pg_token: q("pg_token"), tid: tid})
      .then(function(d){
        try { sessionStorage.setItem(kKey, d.token); } catch(e){}
        history.replaceState(null, "", "/kr/r/" + d.token);
        render(d.result, d.token, d.receipt_url);
      })
      .catch(function(e){ fail("결제를 확인하지 못했습니다", e.message); });
    return;
  }

  if (kind === "r" && token){
    post("/api/kr/result", {token: token})
      .then(function(d){ render(d.result, token, ""); })
      .catch(function(e){ fail("결과를 불러오지 못했습니다", e.message); });
    return;
  }

  fail("잘못된 주소입니다", "결과 링크를 다시 확인해 주세요.");
})();
</script>
</body>
</html>
